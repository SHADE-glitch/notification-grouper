name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # check:log walks `git log <anchor>..HEAD`; a shallow clone would not
          # contain the coverage anchor and the check would fail for the wrong
          # reason. Full history is required.
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
      - run: npm test
      - run: npm run check:log
      # Coverage reading (not a gate): Node's built-in coverage over the two
      # tests/*.mjs suites. No threshold, so it cannot fail the run.
      - run: npm run test:coverage
